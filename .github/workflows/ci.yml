name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase0:
    name: Phase 0 (Harness, ohne torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        working-directory: phase0
        run: |
          pip install -r requirements-dev.txt
          pytest

  backend:
    name: Backend (API + Story-Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Kern ohne torch)
        run: pip install fastapi "uvicorn[standard]" sqlmodel pyyaml python-dotenv python-multipart httpx pytest
      - name: Story-Linter
        working-directory: backend
        run: python lint_stories.py --coverage
      - name: Tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (Syntax-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ES-Module syntaktisch prüfen
        working-directory: frontend
        run: |
          for f in src/app.js src/api.js src/ui.js src/views/*.js sw.js; do
            node --check "$f"
          done
